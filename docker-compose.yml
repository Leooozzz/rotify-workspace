services:
  postgres-gateway:
    image: postgres:15-alpine
    container_name: rotify_postgres_gateway
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: gateway_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_gateway:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: rotify_redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rotify_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: rootpassword
    ports:
      - "5672:5672"  
      - "15672:15672"
    restart: always

  gateway-auth-service:
    build:
      context: ./apps/gateway-auth-service
      dockerfile: Dockerfile
    container_name: rotify_gateway_auth_service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://root:rootpassword@postgres-gateway:5432/gateway_db?schema=public"
      JWT_SECRET: "super_senha_secreta_para_desenvolvimento"
      PORT: 3001
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    depends_on:
      - postgres-gateway
      - redis
    restart: always

volumes:
  pgdata_gateway:
